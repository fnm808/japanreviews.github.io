<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Sweet Snacks Tier List</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Japanese Sweet Snacks Tier List</h1>
        
        <div class="tier-list">
            <div class="tier-row">
                <div class="tier-label tier-s">S</div>
                <div class="tier-items" id="tier-s"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label tier-a">A</div>
                <div class="tier-items" id="tier-a"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label tier-b">B</div>
                <div class="tier-items" id="tier-b"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label tier-c">C</div>
                <div class="tier-items" id="tier-c"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label tier-d">D</div>
                <div class="tier-items" id="tier-d"></div>
            </div>

        </div>

        <div class="description-panel">
            <div id="description-content" class="no-selection">
                Click on any item to see its description
            </div>
        </div>
    </div>
	
	<script src="script.js"></script>
</body>
</html>
